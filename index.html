<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Britney's Workout</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Arial, sans-serif;
      text-align: center;
      color: #222;
    }

    .card {
      width: 90%;
      max-width: 500px;
      background: white;
      padding: 40px 25px;
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.12);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 34px;
    }

    .runtime {
      color: #666;
      margin-bottom: 30px;
      font-size: 18px;
    }

    .watch {
      display: block;
      padding: 18px;
      margin: 15px 0;
      background: #1769e0;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-size: 22px;
      font-weight: 600;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 8px;
      border: 1px solid #aaa;
      border-radius: 12px;
      background: white;
      font-size: 17px;
      cursor: pointer;
    }

    #status {
      min-height: 24px;
      margin-top: 12px;
      color: #555;
    }

    .help {
      margin-top: 25px;
      color: #666;
      font-size: 15px;
      line-height: 1.45;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>Britney's Workout</h1>

  <div class="runtime">
    5 minutes 22 seconds
  </div>

  <a class="watch"
     href="https://drive.google.com/file/d/1fTJADK9v0ooH9Shi76zEueB1NvZdVqW1/view?usp=drivesdk">
     ▶ Watch Movie
  </a>

  <button onclick="copyMovieLink()">
    Copy Movie Link
  </button>

  <div id="status"></div>

  <div class="help">
    If the movie doesn't open normally, copy the movie link,
    open Safari or Chrome, and paste the link into the browser's
    address bar.
  </div>

</div>

<script>
const movieURL =
"https://drive.google.com/file/d/1fTJADK9v0ooH9Shi76zEueB1NvZdVqW1/view?usp=drivesdk";

function copyMovieLink() {
  navigator.clipboard.writeText(movieURL)
    .then(() => {
      document.getElementById("status").textContent =
        "Movie link copied.";
    })
    .catch(() => {
      document.getElementById("status").textContent =
        "Press and hold the Watch Movie button to copy the link.";
    });
}
</script>

</body>
</html>
